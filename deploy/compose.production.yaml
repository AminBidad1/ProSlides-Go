services:
  api:
    image: ${API_IMAGE:?set API_IMAGE to an immutable API image tag}
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL through the deployment secret store}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL through the deployment secret store}
      MEDIA_STORAGE_BACKEND: s3
      MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT:?set MEDIA_S3_ENDPOINT}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:?set MEDIA_S3_REGION}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:?set MEDIA_S3_BUCKET}
      MEDIA_S3_ACCESS_KEY_ID: ${MEDIA_S3_ACCESS_KEY_ID:?set MEDIA_S3_ACCESS_KEY_ID through the deployment secret store}
      MEDIA_S3_SECRET_ACCESS_KEY: ${MEDIA_S3_SECRET_ACCESS_KEY:?set MEDIA_S3_SECRET_ACCESS_KEY through the deployment secret store}
      MEDIA_S3_FORCE_PATH_STYLE: ${MEDIA_S3_FORCE_PATH_STYLE:-false}
      DEPENDENCY_CHECK_TIMEOUT: ${DEPENDENCY_CHECK_TIMEOUT:-2s}
      MIGRATION_TIMEOUT: ${MIGRATION_TIMEOUT:-2m}
      LIVE_REQUEST_TIMEOUT: ${LIVE_REQUEST_TIMEOUT:-10s}
      DATABASE_POOL_MAX_CONNS: ${DATABASE_POOL_MAX_CONNS:-50}
      DATABASE_POOL_MIN_CONNS: ${DATABASE_POOL_MIN_CONNS:-5}
      DATABASE_CONN_MAX_LIFETIME: ${DATABASE_CONN_MAX_LIFETIME:-30m}
      DATABASE_CONN_MAX_IDLE_TIME: ${DATABASE_CONN_MAX_IDLE_TIME:-5m}
      SESSION_TTL: ${SESSION_TTL:-168h}
      AUTH_REQUIRE_EMAIL_VERIFICATION: ${AUTH_REQUIRE_EMAIL_VERIFICATION:-true}
      EMAIL_VERIFICATION_TTL: ${EMAIL_VERIFICATION_TTL:-10m}
      EMAIL_VERIFICATION_RESEND_DELAY: ${EMAIL_VERIFICATION_RESEND_DELAY:-60s}
      EMAIL_VERIFICATION_MAX_ATTEMPTS: ${EMAIL_VERIFICATION_MAX_ATTEMPTS:-5}
      EMAIL_VERIFICATION_PEPPER: ${EMAIL_VERIFICATION_PEPPER:?set a random pepper of at least 32 characters}
      PASSWORD_RESET_TTL: ${PASSWORD_RESET_TTL:-15m}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:?set the public HTTPS web origin}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:?set SMTP_FROM_ADDRESS}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-ProSlides}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_JWKS_URL: ${GOOGLE_JWKS_URL:-https://www.googleapis.com/oauth2/v3/certs}
      TRUSTED_PROXY_CIDRS: ${APP_SUBNET:-172.30.0.0/24}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks:
      - app
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE to an immutable web image tag}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/web-healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - app
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

networks:
  app:
    ipam:
      config:
        - subnet: ${APP_SUBNET:-172.30.0.0/24}
